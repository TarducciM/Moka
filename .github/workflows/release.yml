name: release

# Un tag vX.Y.Z costruisce installer NSIS e MSI, l'eseguibile portable e il
# latest.json dell'updater, e li mette in una release in BOZZA: niente va
# online finché qualcuno non la pubblica a mano, dopo averla guardata.
#
# Serve il secret TAURI_SIGNING_PRIVATE_KEY (la chiave privata dell'updater;
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD solo se la chiave ha una password). E il
# repo deve essere pubblico: l'updater scarica da releases/latest/download,
# che per un repo privato non è raggiungibile.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Niente release da un commit che non passa i controlli.
      - name: Controlli
        shell: bash
        run: |
          npm run check
          npm run version:check
          version="${GITHUB_REF_NAME#v}"
          app_version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$version" != "$app_version" ]; then
            echo "::error::Il tag $GITHUB_REF_NAME non coincide con la versione dell'app ($app_version)"
            exit 1
          fi
          cargo test --locked --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Moka ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          # Solo per la release: firma gli installer per l'updater. Nella
          # configurazione normale è spento, così `npm run build` in locale e il
          # workflow `build` funzionano senza la chiave privata.
          args: --config src-tauri/tauri.release.conf.json
          # Da lasciare true (trappola 5 della roadmap): con false sparisce anche
          # la generazione delle firme. Il latest.json però lo costruisce il
          # passo più sotto (trappola 4).
          uploadUpdaterJson: true

      - name: Eseguibile portable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          portable="Moka_${version}_x64-portable.exe"
          cp "src-tauri/target/release/moka.exe" "$portable"
          gh release upload "${{ github.ref_name }}" "$portable" --repo "${{ github.repository }}" --clobber

      # latest.json a mano (trappola 4): tauri-bundler firma direttamente il
      # setup.exe dell'NSIS, non esiste un .nsis.zip, e con NSIS e MSI costruiti
      # insieme tauri-action non trova "la" firma e salta il manifest.
      - name: latest.json per l'updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          nsis_dir="src-tauri/target/release/bundle/nsis"
          exe_file="$nsis_dir/Moka_${version}_x64-setup.exe"
          sig_file="$exe_file.sig"

          if [ ! -f "$sig_file" ]; then
            echo "::error::Firma dell'installer NSIS mancante ($sig_file)"
            ls -la "$nsis_dir" 2>&1 || true
            exit 1
          fi

          signature=$(cat "$sig_file")
          pub_date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > latest.json <<EOF
          {
            "version": "${version}",
            "pub_date": "${pub_date}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${signature}",
                "url": "${base}/Moka_${version}_x64-setup.exe"
              }
            }
          }
          EOF

          # Un manifest malformato rompe l'updater di ogni versione installata
          # in silenzio (non trova mai un aggiornamento): meglio fallire qui.
          jq empty latest.json

          gh release upload "${{ github.ref_name }}" latest.json --repo "${{ github.repository }}" --clobber

  notes:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" --jq .body > notes.md

          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"

          cat > downloads.md <<EOF
          ### Download

          | File | |
          | --- | --- |
          | [Moka_${version}_x64-setup.exe]($base/Moka_${version}_x64-setup.exe) | Installer (NSIS) — consigliato / recommended |
          | [Moka_${version}_x64_en-US.msi]($base/Moka_${version}_x64_en-US.msi) | Installer (MSI) |
          | [Moka_${version}_x64-portable.exe]($base/Moka_${version}_x64-portable.exe) | Portable |

          **Consigliato l'installer.** Aggiunge Moka al menu Start, si disinstalla da "App e funzionalità" e, alla disinstallazione, rimette com'era l'impostazione del coperchio se Moka la stava cambiando. La versione portable va bene per una prova; se la cancelli mentre sta tenendo acceso il portatile a coperchio chiuso, il comando per rimettere l'impostazione è nel README.

          **The installer is recommended.** It adds Moka to the Start menu, uninstalls cleanly from "Apps & features" and, when uninstalling, puts the lid setting back as it was if Moka was changing it. The portable build is fine for a quick try; if you delete it while it is keeping a closed laptop awake, the command to restore the setting is in the README.

          Windows 10/11, 64-bit. Unsigned: Windows SmartScreen may show a warning the first time.
          EOF

          cat downloads.md notes.md > full-notes.md
          gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --notes-file full-notes.md

  cleanup-on-failure:
    needs: publish
    if: failure()
    runs-on: ubuntu-latest
    steps:
      # Una build fallita lascerebbe una bozza con metà degli allegati: meglio
      # toglierla. Il tag resta; si rilancia il workflow una volta sistemato.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes || true
