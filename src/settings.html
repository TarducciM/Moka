<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moka</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="i18n.js"></script>
    <script src="settings.js" defer></script>
  </head>
  <body class="settings-page">
    <main class="settings">
      <header class="settings-head">
        <img src="app-icon.svg" alt="" />
        <h1 data-i18n="settings.title"></h1>
      </header>

      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title" data-i18n="settings.section_general"></h2>
        <div class="field">
          <label for="language" data-i18n="settings.language"></label>
          <select id="language">
            <option value="auto" data-i18n="settings.language_auto"></option>
            <option value="it">Italiano</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="field">
          <label class="field-text" for="autostart">
            <span data-i18n="settings.autostart"></span>
            <small data-i18n="settings.autostart_hint"></small>
          </label>
          <input type="checkbox" id="autostart" />
        </div>
        <div class="field-block" role="radiogroup" aria-labelledby="left-click-label">
          <span id="left-click-label" data-i18n="settings.left_click"></span>
          <label class="radio">
            <input type="radio" name="left-click" value="popover" />
            <span data-i18n="settings.left_click_popover"></span>
          </label>
          <label class="radio">
            <input type="radio" name="left-click" value="toggle" />
            <span data-i18n="settings.left_click_toggle"></span>
          </label>
          <small data-i18n="settings.left_click_hint"></small>
        </div>
        <div class="field">
          <label class="field-text" for="warn-before-end">
            <span data-i18n="settings.warn_before_end"></span>
            <small data-i18n="settings.warn_hint"></small>
          </label>
          <input type="checkbox" id="warn-before-end" />
        </div>
      </section>

      <section class="card" aria-labelledby="rules-title">
        <h2 id="rules-title" data-i18n="settings.section_rules"></h2>
        <p class="hint rules-intro" data-i18n="settings.rules_intro"></p>
        <div class="rules-paused" id="rules-paused" hidden>
          <p class="notice" id="rules-paused-text"></p>
          <button type="button" class="btn btn-small" id="rules-resume" data-i18n="settings.rules_resume"></button>
        </div>
        <ul class="rules" id="rules-list"></ul>
        <p class="hint" id="rules-empty" data-i18n="settings.rules_empty"></p>
        <div class="card-actions rules-actions">
          <button type="button" class="btn btn-small" id="rule-open">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            <span data-i18n="settings.rule_add"></span>
          </button>
          <button type="button" class="btn btn-small btn-quiet" id="rules-pause" data-i18n="settings.rules_pause" hidden></button>
        </div>

        <form class="rule-form" id="rule-form" hidden novalidate>
          <div class="field">
            <label for="rule-kind" data-i18n="settings.rule_when"></label>
            <select id="rule-kind"></select>
          </div>
          <div class="field-block" id="rule-exe-field">
            <label for="rule-exe" data-i18n="settings.rule_program"></label>
            <input
              type="text"
              id="rule-exe"
              class="text-input"
              list="rule-exe-list"
              spellcheck="false"
              autocomplete="off"
              maxlength="64"
              placeholder="obs64.exe"
              aria-describedby="rule-exe-hint"
            />
            <datalist id="rule-exe-list"></datalist>
            <small id="rule-exe-hint" data-i18n="settings.rule_program_hint"></small>
          </div>
          <div class="field-block" id="rule-network-field" hidden>
            <label for="rule-network" data-i18n="settings.rule_network"></label>
            <input
              type="text"
              id="rule-network"
              class="text-input"
              list="rule-network-list"
              spellcheck="false"
              autocomplete="off"
              maxlength="128"
              aria-describedby="rule-network-hint"
            />
            <datalist id="rule-network-list"></datalist>
            <small id="rule-network-hint" data-i18n="settings.rule_network_hint"></small>
          </div>
          <div class="field" id="rule-kbps-field" hidden>
            <label for="rule-kbps" data-i18n="settings.rule_rate"></label>
            <select id="rule-kbps"></select>
          </div>
          <div class="field" id="rule-cpu-field" hidden>
            <label for="rule-cpu" data-i18n="settings.rule_load"></label>
            <select id="rule-cpu"></select>
          </div>
          <div class="field-block" id="rule-schedule-field" hidden>
            <span id="rule-days-label" data-i18n="settings.rule_days"></span>
            <div class="days" id="rule-days" role="group" aria-labelledby="rule-days-label"></div>
            <div class="times">
              <label for="rule-from" data-i18n="settings.rule_from"></label>
              <input type="time" id="rule-from" value="09:00" />
              <label for="rule-to" data-i18n="settings.rule_to"></label>
              <input type="time" id="rule-to" value="18:00" />
            </div>
          </div>
          <div class="field">
            <label for="rule-mode" data-i18n="settings.rule_keep"></label>
            <select id="rule-mode">
              <option value="system" data-i18n="mode.system"></option>
              <option value="display" data-i18n="mode.display"></option>
            </select>
          </div>
          <div class="field">
            <label for="rule-then" data-i18n="settings.rule_then"></label>
            <select id="rule-then"></select>
          </div>
          <p class="error" id="rule-error" role="alert" hidden></p>
          <div class="card-actions">
            <button type="submit" class="btn btn-small btn-accent" data-i18n="settings.rule_save"></button>
            <button type="button" class="btn btn-small btn-quiet" id="rule-cancel" data-i18n="settings.rule_cancel"></button>
          </div>
        </form>
      </section>

      <section class="card" aria-labelledby="presence-title">
        <h2 id="presence-title" data-i18n="settings.section_presence"></h2>
        <div class="field">
          <label class="field-text" for="presence">
            <span data-i18n="settings.presence"></span>
            <small data-i18n="settings.presence_hint"></small>
          </label>
          <input type="checkbox" id="presence" aria-describedby="presence-warning" />
        </div>
        <p class="warning" id="presence-warning">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.5 2.8 19.5h18.4z" />
            <path d="M12 10v4.5M12 17.2v.1" />
          </svg>
          <span data-i18n="settings.presence_warning"></span>
        </p>
      </section>

      <section class="card" id="lid-card" hidden aria-labelledby="lid-title">
        <h2 id="lid-title" data-i18n="settings.section_lid"></h2>
        <p class="notice" id="lid-policy" data-i18n="settings.lid_policy" hidden></p>
        <div id="lid-controls">
          <div class="field-block" role="radiogroup" aria-labelledby="lid-intro">
            <span id="lid-intro" data-i18n="settings.lid_intro"></span>
            <label class="radio">
              <input type="radio" name="lid-mode" value="windows" />
              <span data-i18n="settings.lid_windows"></span>
            </label>
            <label class="radio">
              <input type="radio" name="lid-mode" value="ac" />
              <span data-i18n="settings.lid_ac"></span>
            </label>
            <label class="radio">
              <input type="radio" name="lid-mode" value="always" />
              <span data-i18n="settings.lid_always"></span>
            </label>
            <div class="sub-field" id="backpack-field">
              <label for="backpack" data-i18n="settings.backpack"></label>
              <select id="backpack"></select>
              <small data-i18n="settings.backpack_hint"></small>
            </div>
          </div>
          <div class="field">
            <label class="field-text" for="desk-mode">
              <span data-i18n="settings.desk_mode"></span>
            </label>
            <input type="checkbox" id="desk-mode" />
          </div>
          <div class="field">
            <label class="field-text" for="lock-on-open">
              <span data-i18n="settings.lock_on_open"></span>
            </label>
            <input type="checkbox" id="lock-on-open" />
          </div>
        </div>
        <div class="lid-status">
          <p id="windows-lid"></p>
          <p class="notice" id="lid-held" data-i18n="settings.windows_held" hidden></p>
          <p class="error" id="lid-error" role="alert" hidden></p>
          <button type="button" class="btn btn-small" id="restore-lid" data-i18n="settings.restore_now" hidden></button>
          <small data-i18n="settings.lid_shared"></small>
        </div>
      </section>

      <section class="card" id="battery-card" hidden aria-labelledby="battery-title">
        <h2 id="battery-title" data-i18n="settings.section_battery"></h2>
        <div class="field">
          <label for="battery-threshold" data-i18n="settings.battery_threshold"></label>
          <select id="battery-threshold"></select>
        </div>
        <p class="hint" data-i18n="settings.battery_hint"></p>
      </section>

      <section class="card" aria-labelledby="durations-title">
        <h2 id="durations-title" data-i18n="settings.section_durations"></h2>
        <label for="durations" data-i18n="settings.durations_label"></label>
        <input
          type="text"
          id="durations"
          class="text-input"
          spellcheck="false"
          autocomplete="off"
          aria-describedby="durations-hint durations-error"
        />
        <p class="hint" id="durations-hint" data-i18n="settings.durations_hint"></p>
        <p class="error" id="durations-error" role="alert" hidden></p>
      </section>

      <section class="card" aria-labelledby="shortcuts-title">
        <h2 id="shortcuts-title" data-i18n="settings.section_shortcuts"></h2>
        <div class="field">
          <label for="shortcut-toggle" data-i18n="settings.shortcut_toggle"></label>
          <select id="shortcut-toggle"></select>
        </div>
        <div class="field">
          <label for="shortcut-screen-off" data-i18n="settings.shortcut_screen_off"></label>
          <select id="shortcut-screen-off"></select>
        </div>
        <p class="hint" data-i18n="settings.shortcut_hint"></p>
        <p class="error" id="shortcut-error" role="alert" hidden></p>
      </section>

      <section class="card" aria-labelledby="updates-title">
        <h2 id="updates-title" data-i18n="settings.section_updates"></h2>
        <p class="hint" data-i18n="settings.update_hint"></p>
        <div class="card-actions">
          <button type="button" class="btn btn-small" id="update-check" data-i18n="settings.update_check"></button>
          <button type="button" class="btn btn-small btn-accent" id="update-install" data-i18n="settings.update_install" hidden></button>
        </div>
        <p class="notice" id="update-status" role="status" hidden></p>
      </section>

      <section class="card" id="diagnose-card" aria-labelledby="diagnose-title">
        <h2 id="diagnose-title" data-i18n="settings.section_diagnose"></h2>
        <p class="hint diagnose-intro" data-i18n="settings.diagnose_intro"></p>
        <div class="card-actions">
          <button type="button" class="btn btn-small" id="diagnose-run" data-i18n="settings.diagnose_run"></button>
        </div>
        <p class="hint" id="diagnose-status" role="status" hidden></p>

        <div class="diagnose" id="diagnose-out" hidden>
          <h3 data-i18n="settings.diagnose_now"></h3>
          <ul class="diag-list" id="diagnose-now"></ul>
          <div class="card-actions">
            <button type="button" class="btn btn-small" id="diagnose-admin" aria-describedby="diagnose-admin-hint">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 3 5 6v5.5c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5V6z" />
              </svg>
              <span data-i18n="settings.diagnose_who"></span>
            </button>
          </div>
          <p class="hint" id="diagnose-admin-hint" data-i18n="settings.diagnose_who_hint"></p>
          <p class="error" id="diagnose-error" role="alert" hidden></p>
          <div id="diagnose-requests" hidden>
            <ul class="diag-list" id="diagnose-requests-list"></ul>
            <p class="hint" id="diagnose-requests-none" data-i18n="settings.diagnose_requests_none" hidden></p>
            <p class="diag-subtitle" id="diagnose-timers-title" data-i18n="settings.diagnose_timers" hidden></p>
            <pre class="diag-raw" id="diagnose-timers-raw" hidden></pre>
          </div>

          <h3 data-i18n="settings.diagnose_rests"></h3>
          <ol class="diag-rests" id="diagnose-rests"></ol>
          <p class="hint" id="diagnose-rests-empty" data-i18n="settings.diagnose_rests_empty" hidden></p>

          <h3 data-i18n="settings.diagnose_wake"></h3>
          <p class="diag-timers" id="diagnose-timers"></p>
          <ul class="diag-list" id="diagnose-devices"></ul>
          <p class="hint" id="diagnose-devices-none" data-i18n="settings.diagnose_devices_none" hidden></p>
          <p class="hint" data-i18n="settings.diagnose_devices_hint"></p>
        </div>
      </section>

      <footer class="about" aria-labelledby="about-title">
        <h2 class="about-title" id="about-title" data-i18n="settings.section_about"></h2>
        <p id="version"></p>
        <p data-i18n="settings.privacy"></p>
        <p>
          <span data-i18n="settings.license"></span>
          <span data-i18n="settings.credits"></span>
          <a href="https://mtsolutions.studio">MTSolutions</a>
        </p>
      </footer>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
